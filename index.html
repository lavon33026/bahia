<style>
/* Layout: one-column phone app — sticky brand bar, scrolling view, bottom tab bar; centered 720px column on desktop */
:root{
  --bg:#FBF7FA; --surface:#FFFFFF; --sunk:#F3ECF2; --ink:#2A1630; --muted:#76627A; --line:#E7DCE6;
  --acai:#5B1F5E; --on-acai:#FFFFFF; --mango:#E8922A; --mango-soft:#FCEBD3; --leaf:#2D7A57; --leaf-soft:#DDF0E6;
  --danger:#B8402B; --danger-soft:#F8E1DB;
  --f-display:"Bricolage Grotesque","Rubik",system-ui,sans-serif;
  --f-body:"Rubik",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --r:12px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#150B17; --surface:#20142A; --sunk:#1A1020; --ink:#F4EAF3; --muted:#B5A2B8; --line:#3A2A40;
  --acai:#D8A0E0; --on-acai:#1A0B1C; --mango:#F3B45E; --mango-soft:#3A2913; --leaf:#72C99E; --leaf-soft:#173126;
  --danger:#F08A73; --danger-soft:#3D1B15; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
img{max-width:100%}
[hidden]{display:none!important}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:0 110px}
.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top .in{max-width:720px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:10px}
.brand{font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:-.01em;color:var(--acai);line-height:1}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.top .sp{flex:1}
.chipbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
.tabs{position:fixed;bottom:0;left:0;right:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .in{max-width:720px;margin:0 auto;display:flex}
.tabs button{flex:1;border:0;background:none;padding:10px 4px 12px;font-size:12px;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-current="page"]{color:var(--acai);font-weight:600}
h1{font-family:var(--f-display);font-weight:800;font-size:26px;line-height:1.15;margin:20px 0 4px;text-wrap:balance;letter-spacing:-.01em}
h2{font-family:var(--f-display);font-weight:600;font-size:18px;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 16px}
.stack{display:flex;flex-direction:column;gap:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.panel-h .sp{flex:1}
.lbl{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;align-items:center;gap:12px;padding:12px 4px;border-top:1px solid var(--line);min-width:0}
.row:first-child{border-top:0}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:500;overflow-wrap:anywhere}
.row .m{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.list{display:flex;flex-direction:column}
.tap{cursor:pointer;border-radius:8px}
.tap:hover{background:var(--sunk)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:500;border-radius:999px;padding:2px 9px;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.pill.ok{background:var(--leaf-soft);color:var(--leaf)}
.pill.warn{background:var(--mango-soft);color:var(--mango)}
.pill.bad{background:var(--danger-soft);color:var(--danger)}
.check{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.check.done{background:var(--leaf);border-color:var(--leaf);color:var(--surface)}
.check svg{width:16px;height:16px}
.btn{border:0;border-radius:10px;padding:12px 16px;font-weight:600;cursor:pointer;background:var(--acai);color:var(--on-acai)}
.btn.ghost{background:var(--sunk);color:var(--ink)}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn.sm{padding:7px 12px;font-size:13px}
.btn.wide{width:100%}
.btn:disabled{opacity:.55;cursor:default}
.btn:focus-visible,.chipbtn:focus-visible,.tabs button:focus-visible,.tap:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--mango);outline-offset:2px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.seg{display:flex;gap:4px;background:var(--sunk);border-radius:10px;padding:4px;overflow-x:auto}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:8px 10px;font-size:13px;cursor:pointer;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600}
.meter{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;background:var(--leaf);border-radius:99px}
.empty{color:var(--muted);text-align:center;padding:20px 8px;font-size:14px}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.thumbs img{width:56px;height:56px;object-fit:cover;border-radius:8px;cursor:pointer;background:var(--sunk)}
.num{font-variant-numeric:tabular-nums}
.cnt{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center}
.cnt input{width:92px;text-align:center;padding:10px 6px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-variant-numeric:tabular-nums}
.cnt input.low{border-color:var(--danger);background:var(--danger-soft)}
form.f{display:flex;flex-direction:column;gap:14px}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld label,.fld .lab{font-size:13px;font-weight:500}
.hint{font-size:12px;color:var(--muted)}
.fld input,.fld select,.fld textarea{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:420px){.two{grid-template-columns:1fr}}
.days{display:flex;flex-wrap:wrap;gap:6px}
.days label{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:6px 11px;font-size:13px;cursor:pointer}
.sect{font-family:var(--f-display);font-weight:600;font-size:15px;color:var(--acai);margin-top:6px;padding-top:12px;border-top:1px dashed var(--line)}
.priv{background:var(--sunk);border-radius:10px;padding:12px;font-size:13px;color:var(--muted)}
.scrim{position:fixed;inset:0;z-index:20;background:rgba(20,8,22,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:18px}}
.sheet-h{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.sheet-h h2{flex:1}
.x{border:0;background:var(--sunk);border-radius:50%;width:34px;height:34px;cursor:pointer;font-size:18px;line-height:1}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:30;max-width:calc(100% - 32px)}
.daygrp{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 0 2px}
.bigimg{width:100%;min-height:120px;border-radius:12px;background:var(--sunk)}
.callout{border-inline-start:4px solid var(--mango);background:var(--mango-soft);border-radius:8px;padding:12px;font-size:14px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;overflow-wrap:anywhere}
.camera{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;border:2px dashed var(--acai);border-radius:12px;padding:22px;cursor:pointer;color:var(--acai);font-weight:600;text-align:center}
.camera svg{width:34px;height:34px}
.camera input{position:absolute;width:1px;height:1px;opacity:0}
.login{max-width:420px;margin:0 auto;padding-top:24px}
.code{letter-spacing:.4em;text-align:center;font-size:24px!important;font-variant-numeric:tabular-nums}
.big{font-family:var(--f-display);font-weight:800;font-size:34px;letter-spacing:.15em;color:var(--acai)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(16px);opacity:.6}}}
</style>
</head>

/* ---------- tasks logic ---------- */
function periodOf(task){return task.freq==="daily"?D.today:task.freq==="weekly"?D.week:"once"}
function compFor(task){var id=task.id+"__"+periodOf(task);for(var i=0;i<D.completions.length;i++)if(D.completions[i].id===id)return D.completions[i];return null}
function dueTasks(forEmail){var out=[];
  D.tasks.forEach(function(task){if(!task.active)return;if(forEmail&&task.assignee!==forEmail&&task.assignee!=="any")return;
    if(task.freq==="once"){if(task.dueDate&&task.dueDate>D.today)return;if(task.completedOn&&task.completedOn!==D.today)return}
    out.push({task:task,comp:compFor(task)})});
  var order={daily:0,weekly:1,once:2};
  out.sort(function(a,b){return ((a.comp?1:0)-(b.comp?1:0))||(order[a.task.freq]-order[b.task.freq])||String(a.task.title).localeCompare(String(b.task.title))});
  return out}

/* ---------- inventory logic ---------- */
function itemsMap(){var m={};(D.items||[]).forEach(function(i){m[i.id]=i});return m}
function supMap(){var m={};(D.suppliers||[]).forEach(function(s){m[s.id]=s});return m}
function hasMin(it){return it&&it.minLevel!==""&&it.minLevel!==undefined&&it.minLevel!==null}
function latestValue(itemId){var cs=D.counts||[];for(var i=0;i<cs.length;i++){var v=cs[i].values[itemId];if(v!==undefined&&v!==null&&v!=="")return {v:Number(v),date:cs[i].date}}return null}
function lowList(){var out=[];(D.items||[]).forEach(function(it){if(!it.active)return;var lv=latestValue(it.id);if(!lv||!hasMin(it))return;
  if(lv.v<=Number(it.minLevel)){var q=Math.max(Math.ceil(Number(it.parLevel||0)-lv.v),0);out.push({it:it,v:lv.v,q:q})}});return out}
function todayCount(){var cs=D.counts||[];for(var i=0;i<cs.length;i++)if(cs[i].date===D.today)return cs[i];return null}

function compressToB64(file){return new Promise(function(res,rej){var u=URL.createObjectURL(file);var i=new Image();
  i.onload=function(){var max=1600,sc=Math.min(1,max/Math.max(i.width,i.height));var c=document.createElement("canvas");c.width=Math.round(i.width*sc);c.height=Math.round(i.height*sc);
    c.getContext("2d").drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL("image/jpeg",.8).split(",")[1])};
  i.onerror=function(){URL.revokeObjectURL(u);rej(new Error("generic"))};i.src=u})}
function thumbs(ids){if(!ids||!ids.length)return "";return '<div class="thumbs">'+ids.map(function(id){return '<img alt="" data-pid="'+esc(id)+'" data-act="photo" data-id="'+esc(id)+'">'}).join("")+"</div>"}
function fillPhotos(root){var imgs=(root||document).querySelectorAll("img[data-pid]");Array.prototype.forEach.call(imgs,function(im){var id=im.getAttribute("data-pid");var full=im.classList.contains("bigimg");var key=id+(full?"_f":"_t");
  if(photoCache[key]){im.src=photoCache[key];return}
  api("photo",{id:id,thumb:!full}).then(function(r){photoCache[key]=r.src;im.src=r.src}).catch(function(){})})}

document.addEventListener("click",function(e){var el=e.target.closest("[data-act]");if(!el)return;var a=el.getAttribute("data-act");var id=el.getAttribute("data-id");
  if(a==="closeScrim"&&e.target!==el)return;

  case "tab":S.tab=el.getAttribute("data-tab");S.countDraft=null;if(S.tab==="history")S.hist=null;render(true);window.scrollTo(0,0);refresh();break;

  case "newTask":sheetEditTask(null);break;
  case "editTask":sheetEditTask(id);break;
  case "goCount":S.tab="inventory";S.invTab="count";S.countDraft=null;render(true);break;
  case "inv":S.invTab=el.getAttribute("data-s");S.countDraft=null;render(true);break;

  case "photo":openSheet(t("photo"),'<img class="bigimg" alt="" data-pid="'+esc(id)+'">');break;
  case "hr":S.histRange=el.getAttribute("data-r");S.hist=null;render(true);break;
  case "orderSt":run("orderStatus",{id:id,status:el.getAttribute("data-st")},t("saved"));break;
  case "undo":run("undo",{id:id},t("saved")).then(function(r){if(r!==false)closeSheet()});break;
  case "del":var key=el.getAttribute("data-a")+id;if(S.delArm!==key){S.delArm=key;el.textContent=t("confirmDel");return}
    run(el.getAttribute("data-a"),{id:id},t("saved")).then(function(r){if(r!==false)closeSheet()});break;
  case "newCode":if(S.delArm!=="newCode"){S.delArm="newCode";el.textContent=t("confirmCode");return}
    S.delArm=null;run("newJoinCode",{}).then(function(r){if(r&&r.joinCode)toast(t("codeChanged",{c:r.joinCode}))});break;
  case "signout":gs("signOut",token).catch(function(){});token=null;ls("bb_token",null);D=null;S.screen="login";S.codeSent=false;render(true);break;
  case "otherEmail":S.codeSent=false;render(true);break;
  case "resend":sendCode();break;
  }});
document.addEventListener("keydown",function(e){if((e.key==="Enter"||e.key===" ")&&e.target.matches&&e.target.matches('[role="button"][data-act]')){e.preventDefault();e.target.click()}if(e.key==="Escape"&&document.getElementById("sheetRoot").innerHTML)closeSheet()});
document.addEventListener("change",function(e){if(e.target.id==="histWho"){S.histWho=e.target.value;S.hist=null;render(true)}});
document.addEventListener("input",function(e){var k=e.target.getAttribute&&e.target.getAttribute("data-cnt");if(!k)return;if(!S.countDraft)S.countDraft={};S.countDraft[k]=e.target.value;var it=itemsMap()[k];
  e.target.classList.toggle("low",e.target.value!==""&&hasMin(it)&&Number(e.target.value)<=Number(it.minLevel))});
function busyBtn(f,on){var b=f.querySelector('button[type="submit"]');if(!b)return;if(on){b._l=b.textContent;b.disabled=true;b.textContent=t("uploading")}else{b.disabled=false;b.textContent=b._l||b.textContent}}
function sendCode(){return gs("requestCode",S.loginEmail,lang).then(function(){S.codeSent=true;render(true);var c=document.getElementById("lc");if(c)c.focus()}).catch(function(e){toast(errMsg(e))})}
document.addEventListener("submit",function(e){var f=e.target;if(f.closest("#sheetRoot"))return;e.preventDefault();
  if(f.id==="emailForm"){S.loginEmail=f.querySelector("#le").value.trim().toLowerCase();ls("bb_email",S.loginEmail);busyBtn(f,true);sendCode().then(function(){busyBtn(f,false)})}
  if(f.id==="codeForm"){busyBtn(f,true);gs("verifyCode",S.loginEmail,f.querySelector("#lc").value).then(function(r){token=r.token;ls("bb_token",token);S.codeSent=false;return refresh()}).catch(function(e){busyBtn(f,false);toast(errMsg(e))})}
  if(f.id==="countForm"){var values={};for(var k in (S.countDraft||{})){var v=S.countDraft[k];if(v!==""&&!isNaN(Number(v)))values[k]=Number(v)}
    busyBtn(f,true);run("saveCount",{values:values},t("countSaved")).then(function(){S.countDraft=null;render(true)})}
  if(f.id==="regForm"){var g=function(n){return (f.elements[n]&&f.elements[n].value||"").trim()};
    var pub={firstName:g("firstName"),lastName:g("lastName"),phone:g("phone"),position:g("position"),startDate:g("startDate"),
      availability:Array.prototype.map.call(f.querySelectorAll('input[name="av"]:checked'),function(x){return x.value}),shift:g("shift"),langPref:g("langPref"),shirt:g("shirt"),foodCert:g("foodCert"),certExp:g("certExp")};
    var priv={dob:g("dob"),ssn4:g("ssn4"),street:g("street"),city:g("city"),state:g("state"),zip:g("zip"),emName:g("emName"),emRel:g("emRel"),emPhone:g("emPhone"),notes:g("notes")};
    busyBtn(f,true);run("register",{pub:pub,priv:priv,joinCode:g("joinCode")},t("saved")).then(function(r){busyBtn(f,false);if(r!==false){S.tab="today";render(true);window.scrollTo(0,0)}})}});
document.getElementById("langBtn").addEventListener("click",function(){lang=lang==="he"?"en":"he";ls("bb_lang",lang);render(true)});

/* ---------- load ---------- */
var refreshing=null;
function refresh(){if(!token){S.screen="login";render(true);return Promise.resolve()}
  if(refreshing)return refreshing;
  refreshing=api("boot").then(function(d){D=d;
    var r=d.me.role;S.screen=r==="guest"?"register":r==="inactive"?"inactive":"app";render()}).catch(function(e){if(String(e&&e.message)!=="signed_out")toast(errMsg(e))}).then(function(){refreshing=null});
  return refreshing}
setInterval(function(){if(document.visibilityState==="visible"&&S.screen==="app"&&!document.getElementById("sheetRoot").innerHTML)refresh()},90000);
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible"&&S.screen==="app")refresh()});
applyLang();render(true);refresh();
})();
</script>
</body>
</html>
